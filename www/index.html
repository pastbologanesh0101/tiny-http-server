<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>tiny-http-server</title>
</head>
<body>
  <h1>It works!</h1>
  <p>This page is being served by a from-scratch HTTP/1.1 server built on raw TCP sockets.</p>
  <ul>
    <li><a href="/hello.txt">/hello.txt</a> - static text file</li>
    <li><code>GET /time</code> - current server time</li>
    <li><code>POST /echo</code> - echoes the request body back</li>
  </ul>
</body>
</html>
